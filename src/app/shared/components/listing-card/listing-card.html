<div class="card">
  <img [src]="listing().imageUrl" [alt]="listing().title" />
  <div class="card-body">
    <h3>{{ listing().title }}</h3>
    <p>{{ listing().description }}</p>
    <p class="price">${{ listing().price }}/mo</p>
    <div class="actions">
      <a [routerLink]="['/listing', listing().id]" class="btn">View Details</a>
      <button class="btn btn-outline" (click)="toggleFavorite()">
        {{ isFavorite() ? '★ Favorited' : '☆ Mark as Favorite' }}
      </button>
    </div>
  </div>
</div>
